<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1C156D">
  <title>Sin conexión · MovingUpper</title>
  <style>
    :root { --brand: #1C156D; --accent: #F16522; --bg: #F5F6F9; --text: #16132F; --text-3: #5B6476; --border: #E4E7EC; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { width: 100%; max-width: 380px; text-align: center; background: #fff; border: 1px solid var(--border);
           border-radius: 14px; padding: 28px 20px; box-shadow: inset 0 3px 0 var(--brand); }
    img { width: 72px; height: auto; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--text-3); font-size: 15px; line-height: 1.5; }
    button { width: 100%; height: 48px; border: 0; border-radius: 10px; background: var(--brand); color: #fff;
             font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/brand/movingupper-mark.png" alt="MovingUpper">
    <h1>Sin conexión</h1>
    <p>Este equipo no tiene internet. Los escaneos se validan en el servidor, así que no se pueden registrar hasta que vuelva la conexión. Nada de lo ya guardado se perdió.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
